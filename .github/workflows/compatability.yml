name: Compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "7 7 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  nightly:
    name: Nightly Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      # Only needed for the playback-example feature, which --all-features enables.
      - run: sudo apt-get install -y libasound2-dev libpulse-dev pkg-config cmake
      - run: cargo test --locked --all-features --all-targets --workspace
      # --all-targets excludes doctests, so they need their own run.
      - run: cargo test --locked --all-features --doc --workspace

  update:
    name: Latest Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@beta
      # Only needed for the playback-example feature, which --all-features enables.
      - run: sudo apt-get install -y libasound2-dev libpulse-dev pkg-config cmake
      - run: cargo update
      - run: RUSTFLAGS="-D deprecated" cargo test --locked --all-features --all-targets --workspace
      - run: RUSTFLAGS="-D deprecated" cargo test --locked --all-features --doc --workspace
