name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-fmt:
    name: Code Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  taplo-fmt:
    name: TOML Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: uncenter/setup-taplo@v1
      - run: taplo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Only needed for the playback-example feature, which --all-features enables.
      - run: sudo apt-get install -y libasound2-dev libpulse-dev pkg-config cmake
      - run: RUSTFLAGS="-D warnings" cargo clippy --locked --all-features --all-targets --workspace

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # No --all-features: the crate has no feature-gated items, so this builds
      # the same docs docs.rs does, which also builds without features here.
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --document-private-items

  readme:
    name: README Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The README is generated from the crate docs in lib.rs, so it goes stale
      # as soon as those change without a `cargo rdme` run.
      - run: cargo install --locked cargo-rdme
      - run: cargo rdme --check

  semver:
    name: Semver Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: obi1kenobi/cargo-semver-checks-action@v2

  hack:
    name: Feature Matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Only needed for the playback-example feature, which --all-features enables.
      - run: sudo apt-get install -y libasound2-dev libpulse-dev pkg-config cmake
      - uses: taiki-e/install-action@cargo-hack
      # --all-targets, because playback-example gates an example rather than
      # anything in the library, so without it the feature side of the powerset
      # checks nothing that the featureless side does not.
      - run: cargo hack --feature-powerset check --locked --all-targets

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.87.0
      # --all-targets so that the tests, benches and examples have to build as
      # well, but deliberately not --all-features: playback-example pulls in
      # audio-file, which declares a higher MSRV than this crate does. The
      # example is excluded from --all-targets along with the feature it needs.
      - run: cargo check --locked --all-targets

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
